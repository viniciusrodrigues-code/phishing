<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Você foi hackeado!!</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: black;
        color: rgb(223, 93, 93);
        font-family: "Courier New", monospace;
        text-align: center;
        overflow: hidden;
        cursor: none;
      }

      h1 {
        font-size: 2.5rem;
        text-shadow: 0 0 10px red, 0 0 20px darkred;
        animation: pisca 1s infinite alternate;
        padding: 20px 10px 10px;
      }

      @keyframes pisca {
        from { opacity: 1; }
        to   { opacity: 0.2; }
      }

      .alerta {
        font-size: 1.3rem;
        color: yellow;
        margin: 8px 0;
        text-shadow: 0 0 5px yellow, 0 0 10px orange;
        animation: alertaPisca 0.8s infinite alternate;
      }

      @keyframes alertaPisca {
        from { opacity: 1; }
        to   { opacity: 0.3; }
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
        padding: 12px 16px;
        text-align: left;
        max-height: calc(100vh - 160px);
        overflow-y: hidden;
      }

      .card {
        background: rgba(255,0,0,0.08);
        border: 1px solid rgba(255,0,0,0.4);
        border-radius: 6px;
        padding: 10px 14px;
      }

      .card-title {
        color: red;
        font-size: 0.85rem;
        font-weight: bold;
        border-bottom: 1px solid rgba(255,0,0,0.3);
        margin-bottom: 6px;
        padding-bottom: 4px;
        letter-spacing: 1px;
      }

      .card-body {
        color: #ff8888;
        font-size: 0.78rem;
        line-height: 1.7;
      }

      .card-body span.val {
        color: #ffcc00;
      }

      .spinner-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 8px;
        color: red;
        font-size: 0.95rem;
        position: fixed;
        bottom: 0;
        width: 100%;
        background: black;
        border-top: 1px solid darkred;
      }

      .spinner {
        border: 4px solid rgba(255,255,255,0.2);
        border-top: 4px solid red;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        animation: girar 1s linear infinite;
        flex-shrink: 0;
      }

      @keyframes girar {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .status-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: red;
        animation: pulse 1s infinite;
        margin-right: 4px;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.2; }
      }
    </style>
  </head>
  <body>
    <h1>&#9888; VOCÊ FOI HACKEADO! &#9888;</h1>
    <div class="alerta">ACESSO REMOTO ESTABELECIDO — COLETANDO DADOS...</div>

    <div class="info-grid" id="grid"></div>

    <div class="spinner-container">
      <div class="spinner"></div>
      <span id="statusMsg">Iniciando coleta de dados...</span>
    </div>

    <script>
      // ---------- helpers ----------
      const grid = document.getElementById("grid");
      const statusMsg = document.getElementById("statusMsg");

      function card(title, id) {
        const c = document.createElement("div");
        c.className = "card";
        c.innerHTML = `<div class="card-title">&#9654; ${title}</div><div class="card-body" id="${id}">aguardando...</div>`;
        grid.appendChild(c);
        return document.getElementById(id);
      }

      function row(label, val) {
        return `<span class="status-dot"></span><strong>${label}:</strong> <span class="val">${val ?? "N/D"}</span><br>`;
      }

      // ---------- criar cards imediatamente ----------
      const elIP        = card("REDE / IP PÚBLICO", "c-ip");
      const elGeo       = card("GEOLOCALIZAÇÃO GPS", "c-geo");
      const elNav       = card("NAVEGADOR / SISTEMA", "c-nav");
      const elScreen    = card("TELA / DISPLAY", "c-screen");
      const elHW        = card("HARDWARE DO DISPOSITIVO", "c-hw");
      const elBat       = card("BATERIA", "c-bat");
      const elConn      = card("CONEXÃO DE REDE", "c-conn");
      const elPerms     = card("PERMISSÕES DO BROWSER", "c-perms");
      const elMidia     = card("DISPOSITIVOS DE MÍDIA", "c-midia");
      const elExtra     = card("DADOS EXTRAS", "c-extra");

      // =============================================
      // 1. IP PÚBLICO + dados de geolocalização por IP
      // =============================================
      statusMsg.textContent = "Obtendo IP público...";
      fetch("https://ipapi.co/json/")
        .then(r => r.json())
        .then(d => {
          elIP.innerHTML =
            row("IP Público",     d.ip) +
            row("ASN / ISP",      `${d.asn} — ${d.org}`) +
            row("Rede (CIDR)",    d.network) +
            row("Cidade",         d.city) +
            row("Região",         `${d.region} (${d.region_code})`) +
            row("País",           `${d.country_name} (${d.country})`) +
            row("Continente",     d.continent_code) +
            row("Fuso horário",   d.timezone) +
            row("Lat / Long",     `${d.latitude}, ${d.longitude}`) +
            row("Código postal",  d.postal) +
            row("Moeda",          `${d.currency} (${d.currency_name})`) +
            row("Idioma(s)",      d.languages) +
            row("Chamada país",   `+${d.country_calling_code}`);
          statusMsg.textContent = "IP capturado. Coletando mais dados...";
        })
        .catch(() => { elIP.innerHTML = row("IP Público", "erro ao obter (bloqueado por CORS ou offline)"); });

      // =============================================
      // 2. GEOLOCALIZAÇÃO GPS real
      // =============================================
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude, accuracy, altitude, altitudeAccuracy, heading, speed } = pos.coords;
            elGeo.innerHTML =
              row("Latitude",          latitude.toFixed(6)) +
              row("Longitude",         longitude.toFixed(6)) +
              row("Precisão",          `${accuracy.toFixed(1)} m`) +
              row("Altitude",          altitude != null ? `${altitude.toFixed(1)} m` : "N/D") +
              row("Precisão altitude", altitudeAccuracy != null ? `${altitudeAccuracy.toFixed(1)} m` : "N/D") +
              row("Direção",           heading != null ? `${heading.toFixed(1)}°` : "N/D") +
              row("Velocidade",        speed != null ? `${speed.toFixed(2)} m/s` : "N/D") +
              row("Google Maps", `<a style="color:#ffcc00" href="https://maps.google.com/?q=${latitude},${longitude}" target="_blank">abrir mapa</a>`);
          },
          err => {
            elGeo.innerHTML = row("GPS", `Permissão negada ou erro (${err.message})`);
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        elGeo.innerHTML = row("GPS", "API não disponível");
      }

      // =============================================
      // 3. NAVEGADOR / SISTEMA OPERACIONAL
      // =============================================
      (function () {
        const ua = navigator.userAgent;
        let os = "Desconhecido";
        if (/Windows NT 10/.test(ua))      os = "Windows 10/11";
        else if (/Windows NT 6/.test(ua))  os = "Windows Vista/7/8";
        else if (/Mac OS X/.test(ua))      os = "macOS " + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g, ".") ?? "");
        else if (/Android/.test(ua))       os = "Android " + (ua.match(/Android ([\d.]+)/)?.[1] ?? "");
        else if (/iPhone|iPad/.test(ua))   os = "iOS " + (ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, ".") ?? "");
        else if (/Linux/.test(ua))         os = "Linux";

        let browser = "Desconhecido";
        if (/Edg\//.test(ua))              browser = "Microsoft Edge " + (ua.match(/Edg\/([\d.]+)/)?.[1] ?? "");
        else if (/Chrome\//.test(ua))      browser = "Google Chrome " + (ua.match(/Chrome\/([\d.]+)/)?.[1] ?? "");
        else if (/Firefox\//.test(ua))     browser = "Mozilla Firefox " + (ua.match(/Firefox\/([\d.]+)/)?.[1] ?? "");
        else if (/Safari\//.test(ua))      browser = "Apple Safari";

        elNav.innerHTML =
          row("Sistema Operacional", os) +
          row("Navegador",           browser) +
          row("User-Agent completo", `<span style="font-size:0.7rem;word-break:break-all">${ua}</span>`) +
          row("Plataforma (API)",    navigator.platform) +
          row("Idioma principal",    navigator.language) +
          row("Todos os idiomas",    (navigator.languages ?? []).join(", ")) +
          row("Cookies habilitados", navigator.cookieEnabled ? "SIM" : "NÃO") +
          row("Java habilitado",     navigator.javaEnabled?.() ? "SIM" : "NÃO") +
          row("Online",              navigator.onLine ? "SIM" : "NÃO") +
          row("DNT (Não rastrear)", navigator.doNotTrack ?? "não definido") +
          row("Referrer",            document.referrer || "(acesso direto)");
      })();

      // =============================================
      // 4. TELA / DISPLAY
      // =============================================
      (function () {
        elScreen.innerHTML =
          row("Resolução total",       `${screen.width} × ${screen.height} px`) +
          row("Área disponível",       `${screen.availWidth} × ${screen.availHeight} px`) +
          row("Profundidade de cor",   `${screen.colorDepth} bits`) +
          row("Profundidade de pixel", `${screen.pixelDepth} bits`) +
          row("Pixel ratio (DPR)",     window.devicePixelRatio) +
          row("Viewport (janela)",     `${window.innerWidth} × ${window.innerHeight} px`) +
          row("Orientação",            screen.orientation?.type ?? "N/D") +
          row("Ângulo",                screen.orientation?.angle != null ? `${screen.orientation.angle}°` : "N/D") +
          row("Toque habilitado",      "ontouchstart" in window ? "SIM" : "NÃO") +
          row("Max touch points",      navigator.maxTouchPoints);
      })();

      // =============================================
      // 5. HARDWARE
      // =============================================
      (function () {
        elHW.innerHTML =
          row("Núcleos de CPU",        navigator.hardwareConcurrency ?? "N/D") +
          row("RAM (aprox.)",          navigator.deviceMemory != null ? `${navigator.deviceMemory} GB` : "N/D") +
          row("GPU Renderer",          (() => {
            try {
              const gl = document.createElement("canvas").getContext("webgl");
              const dbg = gl?.getExtension("WEBGL_debug_renderer_info");
              return dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "N/D";
            } catch { return "N/D"; }
          })()) +
          row("GPU Vendor",            (() => {
            try {
              const gl = document.createElement("canvas").getContext("webgl");
              const dbg = gl?.getExtension("WEBGL_debug_renderer_info");
              return dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : "N/D";
            } catch { return "N/D"; }
          })()) +
          row("WebGL versão",          (() => {
            try {
              const gl = document.createElement("canvas").getContext("webgl");
              return gl ? gl.getParameter(gl.VERSION) : "N/D";
            } catch { return "N/D"; }
          })()) +
          row("Audio fingerprint",    (() => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              return `${ctx.sampleRate} Hz / ${ctx.destination.channelCount}ch`;
            } catch { return "N/D"; }
          })());
      })();

      // =============================================
      // 6. BATERIA
      // =============================================
      if ("getBattery" in navigator) {
        navigator.getBattery().then(bat => {
          function updateBat() {
            elBat.innerHTML =
              row("Nível",          `${(bat.level * 100).toFixed(0)}%`) +
              row("Carregando",     bat.charging ? "SIM &#9889;" : "NÃO") +
              row("Tempo p/ carregar", bat.chargingTime === Infinity ? "N/D" : `${bat.chargingTime}s`) +
              row("Tempo restante", bat.dischargingTime === Infinity ? "N/D" : `${Math.floor(bat.dischargingTime / 60)} min`);
          }
          updateBat();
          bat.addEventListener("levelchange",    updateBat);
          bat.addEventListener("chargingchange", updateBat);
        });
      } else {
        elBat.innerHTML = row("Bateria", "API não disponível neste navegador");
      }

      // =============================================
      // 7. CONEXÃO DE REDE
      // =============================================
      (function () {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
          function updateConn() {
            elConn.innerHTML =
              row("Tipo efetivo",      conn.effectiveType) +
              row("Velocidade down",   conn.downlink != null ? `${conn.downlink} Mbps` : "N/D") +
              row("RTT estimado",      conn.rtt != null ? `${conn.rtt} ms` : "N/D") +
              row("Modo economia",     conn.saveData ? "ATIVADO" : "desativado") +
              row("Tipo de rede",      conn.type ?? "N/D");
          }
          updateConn();
          conn.addEventListener("change", updateConn);
        } else {
          elConn.innerHTML = row("Rede", "API não disponível neste navegador");
        }
      })();

      // =============================================
      // 8. PERMISSÕES
      // =============================================
      (async function () {
        const perms = [
          "camera", "microphone", "geolocation",
          "notifications", "clipboard-read", "clipboard-write",
          "accelerometer", "gyroscope", "magnetometer",
          "payment-handler", "midi", "push"
        ];
        let html = "";
        for (const p of perms) {
          try {
            const res = await navigator.permissions.query({ name: p });
            const icon = res.state === "granted" ? "&#9989;" : res.state === "denied" ? "&#10060;" : "&#10067;";
            html += row(p, `${icon} ${res.state}`);
          } catch {
            html += row(p, "N/D");
          }
        }
        elPerms.innerHTML = html;
      })();

      // =============================================
      // 9. DISPOSITIVOS DE MÍDIA
      // =============================================
      (async function () {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cameras  = devices.filter(d => d.kind === "videoinput");
          const mics     = devices.filter(d => d.kind === "audioinput");
          const speakers = devices.filter(d => d.kind === "audiooutput");
          let html =
            row("Câmeras detectadas",    cameras.length) +
            row("Microfones detectados", mics.length) +
            row("Alto-falantes",         speakers.length);
          cameras.forEach((c, i)  => { html += row(`Câmera ${i+1}`,      c.label || `(rótulo oculto sem permissão)`); });
          mics.forEach((m, i)     => { html += row(`Microfone ${i+1}`,   m.label || `(rótulo oculto sem permissão)`); });
          speakers.forEach((s, i) => { html += row(`Alto-falante ${i+1}`,s.label || `(rótulo oculto sem permissão)`); });
          elMidia.innerHTML = html;
        } catch (e) {
          elMidia.innerHTML = row("Mídia", `Erro: ${e.message}`);
        }
      })();

      // =============================================
      // 10. DADOS EXTRAS / TEMPO / CANVAS FINGERPRINT
      // =============================================
      (function () {
        // Canvas fingerprint
        let cfp = "N/D";
        try {
          const canvas = document.createElement("canvas");
          const ctx2d  = canvas.getContext("2d");
          ctx2d.textBaseline = "top";
          ctx2d.font = "14px Arial";
          ctx2d.fillStyle = "#f60";
          ctx2d.fillRect(0, 0, 150, 30);
          ctx2d.fillStyle = "#069";
          ctx2d.fillText("BrowserFingerprint", 2, 2);
          cfp = canvas.toDataURL().slice(-30);
        } catch {}

        // Fuso horário
        const tz  = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const tzOff = new Date().getTimezoneOffset();
        const tzSign = tzOff <= 0 ? "+" : "-";
        const tzHours = String(Math.floor(Math.abs(tzOff) / 60)).padStart(2, "0");
        const tzMins  = String(Math.abs(tzOff) % 60).padStart(2, "0");

        // Plugins
        const plugins = Array.from(navigator.plugins ?? []).map(p => p.name).join(", ") || "nenhum / lista bloqueada";

        // Session/local storage
        let storage = "N/D";
        try { localStorage.setItem("_t", 1); localStorage.removeItem("_t"); storage = "habilitado"; } catch { storage = "bloqueado"; }

        elExtra.innerHTML =
          row("Fuso horário (IANA)", tz) +
          row("Offset UTC",          `UTC${tzSign}${tzHours}:${tzMins}`) +
          row("Data/Hora local",     new Date().toLocaleString("pt-BR")) +
          row("Epoch (ms)",          Date.now()) +
          row("Canvas fingerprint",  cfp) +
          row("Plugins",             `<span style="font-size:0.7rem;word-break:break-all">${plugins}</span>`) +
          row("LocalStorage",        storage) +
          row("SessionStorage",      (() => { try { sessionStorage.setItem("_t",1); sessionStorage.removeItem("_t"); return "habilitado"; } catch { return "bloqueado"; } })()) +
          row("IndexedDB",           "indexedDB" in window ? "disponível" : "N/D") +
          row("WebSockets",          "WebSocket" in window ? "disponível" : "N/D") +
          row("WebWorkers",          "Worker" in window ? "disponível" : "N/D") +
          row("ServiceWorkers",      "serviceWorker" in navigator ? "disponível" : "N/D") +
          row("WebAssembly",         "WebAssembly" in window ? "disponível" : "N/D");
      })();

      // =============================================
      // Efeito visual
      // =============================================
      let flash = true;
      setInterval(() => {
        document.body.style.backgroundColor = flash ? "black" : "#1a0000";
        flash = !flash;
      }, 700);

      const msgs = [
        "Capturando credenciais salvas...",
        "Enviando arquivos para servidor remoto...",
        "Interceptando tráfego de rede...",
        "Instalando keylogger...",
        "Acessando câmera e microfone...",
        "Coletando cookies de sessão bancária...",
        "Upload de dados concluído. Aguardando instruções...",
      ];
      let mi = 0;
      setInterval(() => {
        statusMsg.textContent = msgs[mi % msgs.length];
        mi++;
      }, 2500);

      // Bloqueia teclas, menu e seleção
      document.addEventListener("keydown",     e => { e.preventDefault(); e.stopPropagation(); });
      document.addEventListener("mousedown",   e => { e.preventDefault(); e.stopPropagation(); });
      document.addEventListener("contextmenu", e => e.preventDefault());
      document.addEventListener("selectstart", e => e.preventDefault());

      // Bloqueia back button
      window.history.pushState(null, document.title, window.location.href);
      window.addEventListener("popstate", () =>
        window.history.pushState(null, document.title, window.location.href)
      );
    </script>
  </body>
</html>
